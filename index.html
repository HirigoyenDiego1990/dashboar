<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Finanzas</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN para el gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (Librería para generar .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- SweetAlert2 para modales y alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- NAVBAR CON PERFIL Y LOGOUT -->
    <header class="custom-navbar">
        <div class="custom-navbar-container">
            <!-- Logo / Marca -->
            <a class="brand-title" href="#">
                <i class="fa-solid fa-wallet brand-icon"></i>
                <span>Mis Finanzas</span>
            </a>

            <!-- Área de Usuario & Logout -->
            <div class="user-actions">
                <button id="btnThemeToggle" class="btn-theme-toggle" type="button" aria-label="Cambiar tema visual">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

                <div id="userInfo" class="user-profile-badge d-none d-flex">
                    <img id="userAvatar" src="" alt="Avatar" class="user-avatar-img">
                    <span id="userName" class="user-display-name"></span>
                </div>

                <button id="btnLogout" class="btn-logout" type="button" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Header del Dashboard -->
        <header class="dash-header">
            <h1><i class="fa-solid fa-wallet"></i> Control de <span>Finanzas</span></h1>
            <div class="currency-selector-container">
                <label for="global-currency"><i class="fa-solid fa-coins"></i> Moneda Visualización:</label>
                <select id="global-currency" class="input-select">
                    <option value="USD">USD ($)</option>
                    <option value="ARS" selected>ARS ($)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>
        </header>

        <!-- Tarjetas de Resumen (Incluye Ahorros) -->
        <section class="summary-cards">
            <div class="card balance">
                <p>Balance Total</p>
                <h2 id="total-balance">$0.00</h2>
            </div>
            <div class="card income">
                <p><i class="fa-solid fa-arrow-down"></i> Ingresos</p>
                <h2 id="total-income">$0.00</h2>
            </div>
            <div class="card expense">
                <p><i class="fa-solid fa-arrow-up"></i> Gastos</p>
                <h2 id="total-expense">$0.00</h2>
            </div>
            <!-- NUEVO: Tarjeta de Ahorros Total -->
            <div class="card savings">
                <p><i class="fa-solid fa-piggy-bank"></i> Ahorros Totales</p>
                <h2 id="total-savings">$0.00</h2>
            </div>
        </section>

        <!-- Contenido Principal: Formulario, Gráfico, Presupuestos, Ahorros e Historial -->
        <div class="main-grid">
            
            <!-- Formulario de Nuevo Movimiento -->
            <section class="panel form-panel">
                <h3><i class="fa-solid fa-plus-circle"></i> Nuevo Movimiento</h3>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="currency">Moneda</label>
                        <select id="currency" required>
                            <option value="USD">USD ($)</option>
                            <option value="ARS" selected>ARS ($)</option>
                            <option value="EUR">EUR (€)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción</label>
                        <input type="text" id="description" placeholder="Ej: Sueldo, Supermercado, Ahorro..." required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Monto ($)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Tipo</label>
                            <select id="type" class="form-select">
                                <option value="income">Ingreso</option>
                                <option value="expense">Gasto</option>
                                <option value="ahorro">Ahorro</option>
                                <option value="retiro_ahorro">Retirar Ahorro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category">Categoría</label>
                            <select id="category" required>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Alquiler">Alquiler</option>
                                <option value="Supermercado">Supermercado</option>
                                <option value="Carniceria">Carniceria</option>
                                <option value="Verduleria">Verduleria</option>
                                <option value="Servicios">Servicios</option>
                                <option value="Deporte">Deporte</option>
                                <option value="Viajes">Viajes</option>
                                <option value="Mascota">Mascota</option>
                                <option value="Tarjetas">Tarjetas</option>
                                <option value="Ocio">Ocio</option>
                                <option value="Ahorro">Ahorro</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-add">Agregar Transacción</button>
                </form>
            </section>

            <!-- Panel del Gráfico -->
            <section class="panel chart-panel">
                <h3><i class="fa-solid fa-chart-pie"></i> Gastos por Categoría</h3>
                <div class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>
            </section>

            <!-- NUEVO: Panel de Fondo de Ahorros y Objetivos -->
            <section class="panel savings-panel">
                <div class="panel-header-actions">
                    <h3><i class="fa-solid fa-piggy-bank"></i> Mis Objetivos de Ahorro</h3>
                    <button id="add-savings-goal-btn" class="btn-secondary" type="button">
                        <i class="fa-solid fa-plus"></i> Nuevo Objetivo
                    </button>
                </div>

                <div id="savings-list" class="savings-list">
                    <!-- Ejemplo de Item de Ahorro (Se renderiza con JS) -->
                    <div class="savings-item">
                        <div class="savings-info">
                            <div class="savings-title">
                                <i class="fa-solid fa-shield-halved"></i>
                                <span>Fondo de Emergencia</span>
                            </div>
                            <span class="savings-amount">$150,000 / $300,000</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 50%;"></div>
                        </div>
                        <span class="progress-percentage">50% completado</span>
                    </div>
                </div>
            </section>

            <!-- Panel de Historial de Transacciones -->
            <section class="panel history-panel">
                <div class="panel-header-actions">
                    <h3><i class="fa-solid fa-list-check"></i> Movimientos por Día</h3>
                    <button id="export-excel-btn" class="btn-secondary" type="button">
                        <i class="fa-solid fa-file-excel"></i> Exportar a Excel
                    </button>
                </div>

                <div class="filter-bar" style="margin-top: 1rem; margin-bottom: 1rem;">
                    <div class="filter-group">
                        <label for="period-filter"><i class="fa-solid fa-calendar-days"></i> Período:</label>
                        <select id="period-filter" class="input-select">
                            <option value="all">Todo el historial</option>
                            <option value="this-month" selected>Este mes</option>
                            <option value="last-month">Mes pasado</option>
                            <option value="custom">Rango personalizado...</option>
                        </select>
                    </div>

                    <div id="custom-date-container" class="filter-group custom-dates" style="display: none;">
                        <input type="date" id="filter-start-date">
                        <span>hasta</span>
                        <input type="date" id="filter-end-date">
                    </div>
                </div>

                <div id="grouped-transaction-list" class="grouped-list"></div>
            </section>

            <!-- Panel de Presupuestos por Categoría -->
            <section class="panel budget-panel">
                <div class="panel-header-actions">
                    <h3><i class="fa-solid fa-bullseye"></i> Presupuestos Mensuales</h3>
                    <button id="set-budget-btn" class="btn-secondary" type="button">
                        <i class="fa-solid fa-gear"></i> Configurar Límites
                    </button>
                </div>

                <div id="budget-list" class="budget-list">
                    <!-- Se genera dinámicamente desde JS -->
                </div>
            </section>

        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
